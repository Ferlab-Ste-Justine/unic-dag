# Builds Dockerfile.docling and publishes it to the GitHub Container Registry.

name: Build and Publish Docling Image

env:
  IMAGE_NAME: unic-airflow-docling
  NAMESPACE: ferlab-ste-justine
  REGISTRY: ghcr.io

on:
  push:
    tags:
      - 'docling-v*'

jobs:
  build_and_push:
    name: Build and Push Docling Image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The git tag carries a `docling-v` prefix, which is not semver, extracting version from the tag.
      - name: Extract version tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/docling-v}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=unic-airflow-docling
            org.opencontainers.image.description=UnIC DAG specific Airflow 2.11.2 worker image with docling 2.55.1, CPU-only torch and pre-baked layout/tableformer/EasyOCR weights.
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: Dockerfile.docling
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
